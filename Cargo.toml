[package]
name = "kafae"
version = "0.1.0"
edition = "2021"
description = "Terminal client for Cafe Grader"

[dependencies]
clap = { version = "4.5", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
console = "0.15"
dirs = "6"
glob = "0.3"
indicatif = "0.17"
minreq = { version = "2", features = ["https-rustls", "json-using-serde"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
termimad = "0.31"
which = "7"
